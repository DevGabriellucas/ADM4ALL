services:
  db:
    image: postgres:16-alpine
    container_name: adm4all_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER obrigatorio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD obrigatorio}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB obrigatorio}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-adm4all} -d $${POSTGRES_DB:-adm4all}"]
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:latest
    container_name: adm4all_adminer
    profiles:
      - tools
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${ADMINER_PORT:-8080}:8080"

  backend:
    build: ./backend
    container_name: adm4all_backend
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 8.8.4.4
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL obrigatoria}
      PORT: 8000
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL obrigatoria}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET obrigatorio}
      ADMIN_API_KEY: ${ADMIN_API_KEY:?ADMIN_API_KEY obrigatoria}
      GMAIL_USER: ${GMAIL_USER:?GMAIL_USER obrigatorio}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD:?GMAIL_APP_PASSWORD obrigatoria}
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-}
      EMAIL_TLS_REJECT_UNAUTHORIZED: ${EMAIL_TLS_REJECT_UNAUTHORIZED:-true}
      EXPOSE_ACTIVATION_LINK: ${EXPOSE_ACTIVATION_LINK:-false}
    volumes:
      - ./backend/uploads:/usr/src/app/uploads
      - ./backend/storage:/usr/src/app/storage
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL obrigatoria}
    container_name: adm4all_frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL obrigatoria}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend

volumes:
  pgdata:
