services:
  db:
    image: postgres:16-alpine
    container_name: adm4all_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-adm4all}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-adm4all_dev}
      POSTGRES_DB: ${POSTGRES_DB:-adm4all}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-adm4all} -d $${POSTGRES_DB:-adm4all}"]
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:latest
    container_name: adm4all_adminer
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${ADMINER_PORT:-8080}:8080"

  backend:
    build: ./backend
    container_name: adm4all_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://adm4all:adm4all_dev@db:5432/adm4all
      - PORT=8000
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - ADMIN_API_KEY=${ADMIN_API_KEY:-adm4all_dev_key}
      - JWT_SECRET=${JWT_SECRET:-adm4all_dev_secret_change_me}
      - GMAIL_USER=${GMAIL_USER:-}
      - GMAIL_APP_PASSWORD=${GMAIL_APP_PASSWORD:-}
    volumes:
      - ./backend/uploads:/usr/src/app/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
