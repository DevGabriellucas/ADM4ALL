services:
  db:
    image: postgres:16-alpine
    container_name: adm4all_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-adm4all}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-adm4all}
      POSTGRES_DB: ${POSTGRES_DB:-adm4all}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-adm4all} -d $${POSTGRES_DB:-adm4all}"]
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:latest
    container_name: adm4all_adminer
    profiles:
      - tools
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${ADMINER_PORT:-8080}:8080"

  backend:
    build: ./backend
    container_name: adm4all_backend
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 8.8.4.4
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://adm4all:adm4all@db:5432/adm4all}
      PORT: 8000
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      JWT_SECRET: ${JWT_SECRET:-dev_jwt_secret_change_me_32_chars}
      # Segredo do HMAC que protege os CPFs em cpfs_bloqueados. Trocar este
      # valor invalida os bloqueios ja gravados: os hashes antigos deixam de
      # bater e nao ha como recalcula-los, porque o CPF de origem nao existe
      # mais em lugar nenhum. Ver backend/src/infrastructure/security/hashCpf.ts.
      CPF_HASH_SECRET: ${CPF_HASH_SECRET:-dev_cpf_hash_secret_change_me_32c}
      GMAIL_USER: ${GMAIL_USER:-}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD:-}
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-ADM Para Todos}
      EMAIL_FROM: ${EMAIL_FROM:-}
      EMAIL_TLS_REJECT_UNAUTHORIZED: ${EMAIL_TLS_REJECT_UNAUTHORIZED:-true}
      EXPOSE_ACTIVATION_LINK: ${EXPOSE_ACTIVATION_LINK:-false}
      UPLOADS_DIR: ${UPLOADS_DIR:-/usr/src/app/uploads}
      STORAGE_DIR: ${STORAGE_DIR:-/usr/src/app/storage}
    volumes:
      - ./backend/uploads:/usr/src/app/uploads
      - ./backend/storage:/usr/src/app/storage
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        API_INTERNAL_URL: ${API_INTERNAL_URL:-http://backend:8000}
    container_name: adm4all_frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://backend:8000}
      ADM4ALL_RUNTIME: docker
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend

volumes:
  pgdata:
