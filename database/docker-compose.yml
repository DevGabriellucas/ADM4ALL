services:
  db:
    image: postgres:16-alpine
    container_name: adm4all_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-adm4all}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-adm4all_dev}
      POSTGRES_DB: ${POSTGRES_DB:-adm4all}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Dados persistem entre reinícios do container
      - pgdata:/var/lib/postgresql/data
      # Scripts em ./init rodam na PRIMEIRA inicialização (ordem alfabética)
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-adm4all} -d ${POSTGRES_DB:-adm4all}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # GUI leve para visualizar/consultar os dados em http://localhost:8080
  adminer:
    image: adminer:latest
    container_name: adm4all_adminer
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${ADMINER_PORT:-8080}:8080"

volumes:
  pgdata:
